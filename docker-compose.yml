services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      CHAOS_LATENCY_MS: ${CHAOS_LATENCY_MS:-0}
      CHAOS_FAIL_RATE: ${CHAOS_FAIL_RATE:-0}
    volumes:
      - kiosk-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8800}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  kiosk-data:
